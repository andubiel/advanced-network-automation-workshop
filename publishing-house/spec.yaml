# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: null
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A hands-on, intermediate-level lab where participants use Red Hat Ansible Automation Platform to deploy and validate a multi-vendor EVPN VXLAN switching fabric across Arista EOS and Cisco NX-OS devices. The workshop progresses through dynamic inventory with Netbox, Git-backed backups, compliance enforcement, full fabric deployment, execution tuning for scale, and configuration drift detection with remediation."
    module_summaries:
      - title: "Dynamic Inventory and Basic Setup"
        overview: "Introduces the lab environment and guides through setting up dynamic inventory with Netbox as a Source of Truth, configuring API tokens, and validating multi-vendor device connectivity."
      - title: "Backups as Code"
        overview: "Automates multi-vendor network configuration backups to Git using the ansible.scm collection's git_retrieve and git_publish modules with AAP workflows."
      - title: "Network Compliance"
        overview: "Teaches automated compliance enforcement using resource modules with state: replaced, unified diffs for review, and AAP approval workflows for human-in-the-loop change management."
      - title: "Base Configurations"
        overview: "Deploys foundational fabric configuration (hostnames, VLANs, interfaces, IP addressing) using a role dispatch pattern and Backup-Deploy-Test workflow, including a troubleshooting exercise."
      - title: "Underlay Configs"
        overview: "Deploys OSPF and eBGP underlay routing using a hybrid approach of resource modules and Jinja2 templates, with comprehensive validation of routing adjacencies."
      - title: "Overlay Configs"
        overview: "Deploys the VXLAN EVPN overlay completing the fabric stack, including VTEPs, VNI mappings, VRF tenants, anycast gateways, and validates end-to-end host connectivity."
      - title: "Tuning for Scale"
        overview: "Demonstrates Ansible execution controls (serial, forks, throttle, max_fail_percentage) for safe scaled deployments with intentional error injection and canary patterns."
      - title: "Configuration Drift and Restore"
        overview: "Teaches drift detection using diff_against: intended with Git-stored reference state, and configuration restore to any named Git branch."
    catalog_gap: "This design covers advanced, intermediate-level multi-vendor EVPN VXLAN fabric deployment, compliance enforcement with resource modules, execution tuning for safe scaled rollouts, and Git-based configuration drift detection and remediation — none of which are addressed by the existing introductory network workshop or the EDA/Netbox lab in the catalog."
    rcars_overlap_pct: 78
    rcars_top_matches:
      - title: "Introduction to Ansible Network Automation Workshop"
        ci_name: "zt-ansiblebu.ansible-network-automation-workshop.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.ansible-network-automation-workshop.prod"
        relevance_score: 78
        why_it_fits: "Covers AAP, Arista EOS, network resource modules, Git-backed SCM integration, configuration backup, and multi-vendor network automation with Containerlab."
      - title: "Event-Driven Ansible and Netbox as a source of truth"
        ci_name: "zt-ansiblebu.zt-ans-bu-eda-netbox.prod"
        url: "https://catalog.demo.redhat.com/catalog?item=zt-ansiblebu.zt-ans-bu-eda-netbox.prod"
        relevance_score: 70
        why_it_fits: "Directly addresses Netbox as a Source of Truth and dynamic inventory with AAP integration."
    rejections: []

