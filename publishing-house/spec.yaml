project:
  slug: "advanced-network-automation-workshop"
  owner_email: "tdubiel@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "zero_touch"
  intake_type: "migration"
  automation_type: "ansible"
  description: "This immersive, hands-on workshop highlights the power and capabilities of AAP in automating real-world network scenarios. As a continuation of the Introduction to Ansible Network workshop, this session introduces advanced concepts, including Source of Truth (SoT), dynamic inventories, compliance, configuration drift, and state validation. Rather than focusing on extensive playbook development from scratch, participants will explore the \"art of the possible\" by building workflows to deploy and validate a multi-vendor EVPN VXLAN switching fabric."
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1095"
  workflow_id: "0469fced-8193-4195-8590-fd38d7950f0a"

spec:
  title: "Advanced Ansible Network Automation Workshop"
  learning_objectives:
    - "Configure dynamic inventory using Netbox as a Source of Truth integrated with Red Hat Ansible Automation Platform"
    - "Automate multi-vendor network configuration backups to Git using the ansible.scm collection"
    - "Implement network compliance checks using resource modules with declarative state enforcement and AAP approval workflows"
    - "Deploy a multi-vendor EVPN VXLAN switching fabric across base, underlay, and overlay configuration layers"
    - "Configure Ansible execution controls (serial, forks, throttle, max_fail_percentage) for safe, scaled network deployments"
    - "Implement configuration drift detection and remediation using Git-stored intended state"
  modules:
    - id: module-01
      title: "Dynamic Inventory and Basic Setup"
      duration_min: 30
      status: not_started
    - id: module-02
      title: "Backups as Code"
      duration_min: 25
      status: not_started
    - id: module-03
      title: "Network Compliance"
      duration_min: 30
      status: not_started
    - id: module-04
      title: "Base Configurations"
      duration_min: 30
      status: not_started
    - id: module-05
      title: "Underlay Configs"
      duration_min: 30
      status: not_started
    - id: module-06
      title: "Overlay Configs"
      duration_min: 30
      status: not_started
    - id: module-07
      title: "Tuning for Scale"
      duration_min: 25
      status: not_started
    - id: module-08
      title: "Configuration Drift and Restore"
      duration_min: 25
      status: not_started
  environment:
    platform: "rhel-vms"       # ocp | rhel-vms — determines which sizing fields apply
    topology: "per-student"     # shared-cluster | per-student | cnv-pool
    cloud_provider: troshka    # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student:
      - role: "containerlab"
        count: 1
        cpu: 16
        ram_gb: 64
        disk_gb: 100
        os: "rhel"
      - role: "control"
        count: 1
        cpu: 8
        ram_gb: 32
        disk_gb: 50
        os: "rhel"

    # --- Common fields (both platforms) ---
    aap_version: "2.x"                # required if AAP in products
    ai_requirement: "none"             # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services:                 # named external service dependencies e.g. [github.com]
      - "registry.gitlab.com"
      - "gitlab.com"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 3
  audience: "intermediate"     # beginner | intermediate | advanced

development:
  automation:
    ansible:
      status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

